name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, and let a newer push supersede a running one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stage just the website. The repository also carries the native simulator
      # and its 64 MB connectome, which have no business on a static site.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r index.html assets data .nojekyll _site/

      # enablement turns Pages on via the API the first time this runs, so the
      # repository does not have to be configured by hand beforehand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
